name: Build iStore OS

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
      board:
        description: "Select device board"
        required: false
        default: "fnet3399"
        type: choice
        options:
          - am40
          - dg3399
          - dlfr100
          - fine3399
          - fmx1-pro
          - fnet3399
          - h3399pc
          - king3399
          - mpc1903
          - sv901-eaio
          - sv-33a6x
          - tn3399
          - tpm-312
          - tvi3315a
          - xiaobao-nas
          - zysj-1739a

env:
  REPO_URL: https://github.com/istoreos/istoreos
  # REPO_BRANCH: main
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ inputs.board }}/.config
  DIY_P1_SH: ${{ inputs.board }}/diy-part1.sh
  DIY_P2_SH: ${{ inputs.board }}/diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        REPO_BRANCH:
          # - istoreos-22.03
          - istoreos-24.10
        ARCHITECTURE:
          - aarch64_cortex-a53
        os:
          - ubuntu-22.04

      fail-fast: false

    steps:
    - name: 准备完成
      uses: actions/checkout@main

    - name: 检查服务器配置
      run: |
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo -e "------------------------------- CPU信息 -------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo -e "------------------------------- 内存信息 -------------------------------\n"
        echo "已安装内存详细信息: "
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo -e "------------------------------- 磁盘信息 -------------------------------\n"
        echo -e "磁盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "------------------------------- 磁盘详情 -------------------------------\n"
        df -Th

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "------------------------------- 更新并安装依赖 -------------------------------"
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/${{ matrix.os }})
        wget https://bootstrap.pypa.io/pip/3.6/get-pip.py
        sudo python3 get-pip.py
        sudo rm -rf get-pip.py
        sudo pip install pyelftools
        echo "------------------------------- 清理Docker镜像和软件 -------------------------------"
        docker image prune -a -f
        sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* android* || true
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        echo "------------------------------- 设置工作目录及时区 -------------------------------"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: 克隆源码
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b ${{ matrix.REPO_BRANCH }} openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存构建动作
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: ${{ matrix.os }}-${{ matrix.ARCHITECTURE }}-${{ matrix.REPO_BRANCH }}
        prefix: ${{ github.workspace }}/openwrt

    - name: 加载自定义 feeds
      env:
        FEEDS_CONF_PATH: ${{ env.FEEDS_CONF }}
      run: |
        [ -e $FEEDS_CONF_PATH ] && mv $FEEDS_CONF_PATH openwrt/$FEEDS_CONF
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: 安装 feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: 加载自定义配置
      run: |
        ls -la openwrt
        [[ -d "files" ]] && mv -f files openwrt/files
        [[ -e "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
        chmod +x ${DIY_P2_SH}
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件 [ ${{ inputs.board }} ]
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d")" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 生成 kmods 软件源
      id: kmods
      if: ${{ steps.compile.outputs.status }} == 'success' && !cancelled()
      run: |
        cd openwrt/
        echo "====== 开始生成 kmods 软件源 ======"
        
        # 创建 kmods 仓库目录结构
        KMODS_REPO_DIR="kmods-repository"
        ARCH_DIR="${KMODS_REPO_DIR}/packages/${{ matrix.ARCHITECTURE }}"
        mkdir -p "${ARCH_DIR}"
        
        # 收集所有 kmod 包
        KMOD_COUNT=0
        if ls bin/targets/*/*/packages/kmod-*.ipk >/dev/null 2>&1; then
          echo "📦 收集 kmod 包..."
          cp -v bin/targets/*/*/packages/kmod-*.ipk "${ARCH_DIR}/"
          KMOD_COUNT=$(ls -1 "${ARCH_DIR}"/kmod-*.ipk 2>/dev/null | wc -l)
          echo "✅ 已收集 ${KMOD_COUNT} 个 kmod 包"
        else
          echo "⚠️  未找到 kmod 包"
        fi
        
        # 收集其他内核相关包（可选）
        if ls bin/targets/*/*/packages/*.ipk >/dev/null 2>&1; then
          echo "📦 收集其他包..."
          cp -v bin/targets/*/*/packages/*.ipk "${ARCH_DIR}/" 2>/dev/null || true
        fi
        
        # 生成 Packages 索引文件
        cd "${ARCH_DIR}"
        if [ ${KMOD_COUNT} -gt 0 ]; then
          echo "🔨 生成软件源索引..."
          
          # 使用 opkg-make-index.sh 生成索引（如果存在）
          if command -v opkg-make-index.sh >/dev/null 2>&1; then
            opkg-make-index.sh . > Packages
          else
            # 手动生成简单的 Packages 文件
            for ipk in *.ipk; do
              echo "Package: $(echo $ipk | sed 's/_.*//g')"
              echo "Version: $(echo $ipk | sed 's/.*_\(.*\)_.*\.ipk/\1/')"
              echo "Architecture: ${{ matrix.ARCHITECTURE }}"
              echo "Filename: $ipk"
              echo "Size: $(stat -c%s $ipk)"
              echo "SHA256sum: $(sha256sum $ipk | awk '{print $1}')"
              echo ""
            done > Packages
          fi
          
          # 压缩索引文件
          gzip -k -f Packages
          
          echo "✅ 生成索引文件: Packages 和 Packages.gz"
          echo "📊 包总数: $(grep -c "^Package:" Packages)"
        fi
        
        cd /mnt/workdir/openwrt
        
        # 创建 README 说明文件
        cat > "${KMODS_REPO_DIR}/README.md" << 'EOF'
        # iStoreOS RK3399 Kmods 软件源
        
        ## 使用方法
        
        ### 1. 部署软件源
        ```bash
        # 解压到 Web 服务器目录
        tar -xzf kmods-repository.tar.gz -C /var/www/html/
        ```
        
        ### 2. 在路由器上配置软件源
        ```bash
        # 编辑 /etc/opkg/customfeeds.conf
        echo "src/gz custom_kmods http://YOUR_SERVER_IP/kmods-repository/packages/${{ matrix.ARCHITECTURE }}" >> /etc/opkg/customfeeds.conf
        
        # 更新软件源
        opkg update
        
        # 安装 kmod 包
        opkg install kmod-usb-storage
        ```
        
        ### 3. 使用 nginx 快速部署
        ```bash
        # 使用 Docker 快速部署
        docker run -d -p 8080:80 -v $(pwd)/kmods-repository:/usr/share/nginx/html:ro nginx:alpine
        ```
        
        ## 包含内容
        - 所有编译的内核模块 (kmod-*.ipk)
        - 其他相关软件包
        - 软件源索引 (Packages.gz)
        
        ## 架构信息
        - **架构**: ${{ matrix.ARCHITECTURE }}
        - **平台**: rockchip/armv8 (RK3399)
        - **分支**: ${{ matrix.REPO_BRANCH }}
        - **编译日期**: $(date +"%Y-%m-%d")
        
        ## 注意事项
        - 确保路由器内核版本与此软件源匹配
        - 建议使用 HTTPS 部署生产环境
        - 定期更新软件源以获取最新的包
        EOF
        
        # 打包 kmods 仓库
        echo "📦 打包 kmods 软件源..."
        tar -czf kmods-repository-${{ inputs.board }}-${{ matrix.ARCHITECTURE }}.tar.gz "${KMODS_REPO_DIR}/"
        
        # 生成校验和
        sha256sum kmods-repository-${{ inputs.board }}-${{ matrix.ARCHITECTURE }}.tar.gz > kmods-repository-${{ inputs.board }}-${{ matrix.ARCHITECTURE }}.tar.gz.sha256
        
        echo "✅ kmods 软件源生成完成！"
        ls -lh kmods-repository*.tar.gz*
        
        echo "KMODS_ARCHIVE=kmods-repository-${{ inputs.board }}-${{ matrix.ARCHITECTURE }}.tar.gz" >> $GITHUB_ENV
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 清理并复制固件到对应目录
      id: clean
      if: ${{ steps.compile.outputs.status }} == 'success' && !cancelled()
      run: |
        # Clean up server space
        cd openwrt/
        [[ -d "output" ]] || mkdir output
        if ls bin/targets/*/*/*.img.gz >/dev/null 2>&1; then
          cp -f bin/targets/*/*/*.img.gz output/
        fi
        
        # 复制 kmods 软件源归档
        if [ -f kmods-repository-*.tar.gz ]; then
          echo "📦 复制 kmods 软件源归档..."
          cp -f kmods-repository-*.tar.gz* output/
        fi

        rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null

        echo "📁 output/ 目录内容:"
        ls -l output/

        if [ -z "$(ls -A output/)" ]; then
          echo "❌ 未检测到任何固件文件！请检查 .config 是否正确启用了镜像格式。"
          exit 1
        fi

        # Generate sha256sum file
        cd output/
        for file in *; do [[ ! -d "${file}" ]] && sha256sum "${file}" >"${file}.sha"; done

        # Set output information
        df -hT ${PWD}
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 设置 Release Tag or date
      run: |
        RELEASE_TAG="iStoreOS-24.10-RK3399-$(date +%Y.%m)"
        echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
        BUILD_DATE="$(date +%Y.%m.%d)"
        echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV

    - name: 上传固件
      uses: ncipollo/release-action@main
      if: ${{ steps.clean.outputs.status }} == 'success' && !cancelled()
      with:
        tag: ${{ env.RELEASE_TAG }}
        artifacts: openwrt/output/*
        allowUpdates: true 
        removeArtifacts: false 
        replacesArtifacts: true 
        token: ${{ secrets.GITHUB_TOKEN }}
        body: |  
          ### iStoreOS Image Information  
          - 💻 CPU: rk3399    
          - 📂 源码: ${{ env.REPO_URL }}
          - 🌳 分支: ${{ matrix.REPO_BRANCH }}  
          - ⏱️ 编译时间: ${{ env.BUILD_DATE }}
          - 👤 用户名: root
          - 🔒 密码: password
          - 📒 说明: 如果设备只有一个网口，则此网口就是 `LAN` ；如果设备有两个网口，则一个是 `WAN`，一个是`LAN`，需要接入主路由器后进后台查找对应IP地址再访问。
          
          ### 📦 Kmods 软件源 (新功能)
          - 本次构建包含独立的 **kmods 软件源归档**
          - 文件名: `kmods-repository-${{ inputs.board }}-${{ matrix.ARCHITECTURE }}.tar.gz`
          - 包含所有编译的内核模块 (kmod-*.ipk)
          - 可直接部署为自定义软件源
          - 详细使用说明请查看归档内的 README.md
          
          #### 快速使用
          ```bash
          # 1. 下载并解压 kmods 归档
          # 2. 部署到 Web 服务器
          # 3. 在路由器上添加软件源配置
          echo "src/gz custom_kmods http://YOUR_SERVER/kmods-repository/packages/${{ matrix.ARCHITECTURE }}" >> /etc/opkg/customfeeds.conf
          opkg update
          ```
          
          ### iStoreOS Image Verification  
          - sha256sum   
        draft: false  
        prerelease: false

    - name: 删除自动发布的旧固件
      uses: dev-drprasad/delete-older-releases@v0.3.3
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 15
        delete_tags: true
